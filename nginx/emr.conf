# ==============================================================================
# Nginx Reverse Proxy Configuration - Personal Clinic EMR
# Save to: /etc/nginx/sites-available/emr.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/emr.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP Server Block - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name emr.yourclinicdomain.com;

    # Certbot acme-challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block - Primary Single Subdomain Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emr.yourclinicdomain.com;

    # Certbot SSL Certificates
    ssl_certificate /etc/letsencrypt/live/emr.yourclinicdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emr.yourclinicdomain.com/privkey.pem;

    # High-Security SSL & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum Body Size for Attachments / Exports
    client_max_body_size 25M;

    # Proxy Express Backend API (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Proxy Next.js Frontend App (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
